name: 💿 Step2_Build-Immortalwrt-or-iStoreOS-ARM
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "请选择设备型号"
        required: true
        default: "orangepi-5b"
        type: choice
        options:
          - orangepi-5
          - orangepi-5b
          - orangepi-5-plus
          - orangepi-5-pro
          - orangepi-3b
          - rock5b
          - rock5c
          - nanopc-t6
          - nanopi-r5s
          - nanopi-r5c
      openwrt_kernel:
        description: "请选择内核分支"
        required: true
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - 5.10.y
      luci_version:
        description: "选择luci版本"
        required: true
        default: "24.10.8"
        type: choice
        options:
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  VERSION: ${{ inputs.luci_version }}
  DOCKER: ${{ inputs.include_docker }}

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Подготовка окружения
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo modprobe loop || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dosfstools gzip jq libconfuse-dev libfaketime libfuse-dev libncurses-dev \
            pigz pv u-boot-tools uuid-runtime zstd fdisk btrfs-progs e2fsprogs parted curl git bc wget subversion

      - name: ⬇️ Скачивание rootfs
        id: get_rootfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin/targets/armsr/armv8
          gh release download --repo "${{ github.repository }}" --pattern "*rootfs*.tar.gz" --dir bin/targets/armsr/armv8 --clobber
          
          ROOTFS_PATH=$(find bin/targets/armsr/armv8 -type f -name "*rootfs*.tar.gz" | head -n 1)
          if [ -z "$ROOTFS_PATH" ]; then
            echo "❌ Rootfs не найден в релизах!"
            exit 1
          fi
          echo "Найден rootfs: $ROOTFS_PATH"
          echo "file=$ROOTFS_PATH" >> $GITHUB_OUTPUT

      - name: 🧱 Сборка образа прошивки (ophub)
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git packaging
          cd packaging
          
          # Очистка и подготовка папки armvirt под формат ophub
          mkdir -p openwrt-armvirt
          cp -f "../${{ steps.get_rootfs.outputs.file }}" openwrt-armvirt/openwrt-armvirt-64-default-rootfs.tar.gz
          
          sudo chmod +x make
          # Запуск сборки с явным указанием платы, ядра и ветки stable
          sudo ./make -b "${{ inputs.openwrt_board }}" -k "${{ inputs.openwrt_kernel }}" -s stable -d
          
          mkdir -p ../output
          sudo cp -r out/* ../output/ || true

      - name: 📅 Получение даты
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Загрузка в Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ inputs.openwrt_board }}-${{ env.VERSION }}-${{ steps.date.outputs.date }}
          files: |
            output/*.img.gz
            output/*.7z
            output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
