name: 💿 Step2_Build-Immortalwrt-or-iStoreOS-ARM
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "Модель платы"
        required: true
        default: "orangepi-5b"
        type: choice
        options:
          - orangepi-5
          - orangepi-5b
          - orangepi-5-plus
          - orangepi-5-pro
          - orangepi-3b
          - rock5b
          - rock5c
          - nanopc-t6
          - nanopi-r5s
          - nanopi-r5c
      openwrt_kernel:
        description: "Версия ядра"
        required: true
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - 5.10.y
      luci_version:
        description: "Версия iStoreOS"
        required: true
        default: "24.10.8"
        type: choice
        options:
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
      include_docker:
        description: "Интегрировать Docker"
        required: true
        default: "no"
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  VERSION: ${{ inputs.luci_version }}
  DOCKER: ${{ inputs.include_docker }}

jobs:
  build:
    runs-on: ubuntu-20.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Подготовка окружения
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo modprobe loop || true
          for i in $(seq 0 7); do sudo mknod -m 0660 /dev/loop$i b 7 $i 2>/dev/null || true; done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dosfstools gzip jq libconfuse-dev libfaketime libfuse-dev libncurses-dev \
            pigz pv u-boot-tools uuid-runtime zstd fdisk btrfs-progs e2fsprogs parted curl git bc wget tar

      - name: ⬇️ Скачивание rootfs
        id: rootfs_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build_input
          gh release download --repo "${{ github.repository }}" --pattern "*rootfs*.tar.gz" --dir build_input --clobber
          
          FOUND_FILE=$(find build_input -type f -name "*rootfs*.tar.gz" | head -n 1)
          if [ -z "$FOUND_FILE" ]; then
            echo "❌ Rootfs архив не найден в релизах!"
            exit 1
          fi
          
          cp -f "$FOUND_FILE" openwrt-armvirt-64-default-rootfs.tar.gz
          echo "filepath=openwrt-armvirt-64-default-rootfs.tar.gz" >> $GITHUB_OUTPUT

      - name: 🧱 Сборка образа прошивки
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.rootfs_step.outputs.filepath }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: stable

      - name: 📜 Корректировка имен файлов
        run: |
          if [ -n "$PACKAGED_OUTPUTPATH" ] && [ -d "$PACKAGED_OUTPUTPATH" ]; then
            cd "$PACKAGED_OUTPUTPATH"
            for FILE in *.img.gz; do
              if [ -f "$FILE" ]; then
                NEW_NAME=$(echo "$FILE" | sed "s/openwrt/iStoreOS_${{ env.VERSION }}_Docker-${{ env.DOCKER }}/g")
                [ "$FILE" != "$NEW_NAME" ] && mv "$FILE" "$NEW_NAME"
              fi
            done
          fi

      - name: 📅 Дата сборки
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Загрузка готового образа в Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ inputs.openwrt_board }}-${{ env.VERSION }}-${{ steps.date.outputs.date }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
            ${{ env.PACKAGED_OUTPUTPATH }}/*.7z
            ${{ env.PACKAGED_OUTPUTPATH }}/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
