name: 💿 Step2_Build-Immortalwrt-or-iStoreOS-ARM
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "Модель платы"
        required: true
        default: "orangepi-5b"
        type: choice
        options:
          - orangepi-5
          - orangepi-5b
          - orangepi-5-plus
          - orangepi-5-pro
          - orangepi-3b
          - rock5b
          - rock5c
          - nanopc-t6
          - nanopi-r5s
          - nanopi-r5c
      openwrt_kernel:
        description: "Версия ядра"
        required: true
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - 5.10.y
      luci_version:
        description: "Версия iStoreOS"
        required: true
        default: "24.10.8"
        type: choice
        options:
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
      include_docker:
        description: "Интегрировать Docker"
        required: true
        default: "no"
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  VERSION: ${{ inputs.luci_version }}
  DOCKER: ${{ inputs.include_docker }}

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Подготовка окружения
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo modprobe loop || true
          for i in $(seq 0 7); do sudo mknod -m 0660 /dev/loop$i b 7 $i 2>/dev/null || true; done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dosfstools gzip jq libconfuse-dev libfaketime libfuse-dev libncurses-dev \
            pigz pv u-boot-tools uuid-runtime zstd fdisk btrfs-progs e2fsprogs parted curl git bc wget tar

      - name: ⬇️ Скачивание rootfs
        id: get_rootfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p openwrt-armvirt
          gh release download --repo "${{ github.repository }}" --pattern "*rootfs*.tar.gz" --dir openwrt-armvirt --clobber
          
          FOUND_FILE=$(find openwrt-armvirt -type f -name "*rootfs*.tar.gz" | head -n 1)
          if [ -z "$FOUND_FILE" ]; then
            echo "❌ Rootfs архив не найден в релизах!"
            exit 1
          fi
          
          echo "Используется rootfs: $FOUND_FILE"
          cp -f "$FOUND_FILE" openwrt-armvirt/openwrt-armvirt-64-default-rootfs.tar.gz

      - name: 🧱 Сборка образа (ophub packaging)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git builder
          
          # Находим точную директорию со скриптом сборки
          BUILD_DIR=$(find builder -type f -name "make" -exec dirname {} \; | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            BUILD_DIR=$(find builder -type f -name "make.sh" -exec dirname {} \; | head -n 1)
          fi
          
          echo "Рабочая директория сборщика: $BUILD_DIR"
          cp -r openwrt-armvirt "$BUILD_DIR/"
          cd "$BUILD_DIR"
          
          SCRIPT_NAME="./make"
          [ ! -f "$SCRIPT_NAME" ] && SCRIPT_NAME="./make.sh"
          
          sudo chmod +x "$SCRIPT_NAME"
          sudo $SCRIPT_NAME -b "${{ inputs.openwrt_board }}" -k "${{ inputs.openwrt_kernel }}" -s stable -a true -d
          
          mkdir -p $GITHUB_WORKSPACE/output
          sudo cp -r out/* $GITHUB_WORKSPACE/output/ || true

      - name: 📜 Формирование имен файлов
        run: |
          if [ -d "output" ]; then
            cd output
            for FILE in *.img.gz; do
              if [ -f "$FILE" ]; then
                NEW_NAME=$(echo "$FILE" | sed "s/openwrt/iStoreOS_${{ env.VERSION }}_Docker-${{ env.DOCKER }}/g")
                [ "$FILE" != "$NEW_NAME" ] && mv "$FILE" "$NEW_NAME"
              fi
            done
          fi

      - name: 📅 Дата сборки
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Загрузка готового образа в Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ inputs.openwrt_board }}-${{ env.VERSION }}-${{ steps.date.outputs.date }}
          files: |
            output/*.img.gz
            output/*.7z
            output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
