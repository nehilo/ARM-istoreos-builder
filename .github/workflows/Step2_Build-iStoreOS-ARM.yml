name: 💿 Step2_Build-Immortalwrt-or-iStoreOS-ARM
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "请选择设备型号（默认当前常见设备）"
        required: true
        default: "orangepi-5b"
        type: choice
        options:
          - orangepi-5
          - orangepi-5b
          - orangepi-5-plus
          - orangepi-5-pro
          - orangepi-5-ultra
          - orangepi-3b
          - orangepi-zero3
          - cm3588-nas
          - rock5b
          - rock5c
          - rock-5-itx
          - nanopc-t6
          - nanopi-r5s
          - nanopi-r5c
          - h68k
          - h88k
          - r66s
          - r68s
      openwrt_kernel:
        description: "请选择内核版本"
        required: true
        default: "6.1.y"
        type: choice
        options:
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
          - 6.1.y_6.6.y
          - 5.10.y_5.15.y
      luci_version:
        description: "选择luci版本"
        required: true
        default: "24.10.8"
        type: choice
        options:
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
      auto_kernel:
        description: "自动使用最新内核-未匹配则自动"
        required: false
        default: true
        type: boolean
      openwrt_rootfs:
        description: "请选择Rootfs通用底包（先确保St1有执行）"
        required: true
        default: "RELEASE"
        type: choice
        options:
          - RELEASE
      network_settings:
        description: "请选择初始网络配置（先确保St1有执行）"
        required: true
        default: "dhcp"
        type: choice
        options:
          - static
          - dhcp
      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  VERSION: ${{ inputs.luci_version }}
  DOCKER: ${{ inputs.include_docker }}

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Подготовка окружения и утилит сборки
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dosfstools gzip jq libconfuse-dev libfaketime libfuse-dev libncurses-dev \
            pigz pv u-boot-tools uuid-runtime zstd fdisk btrfs-progs e2fsprogs parted

      - name: ⬇️ Скачивание rootfs.tar.gz
        id: get_rootfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin/targets/armsr/armv8
          echo "Поиск и скачивание rootfs из последнего релиза..."
          gh release download --repo "${{ github.repository }}" --pattern "*rootfs*.tar.gz" --dir bin/targets/armsr/armv8 --clobber
          
          ROOTFS_PATH=$(find bin/targets/armsr/armv8 -type f -name "*rootfs*.tar.gz" | head -n 1)
          if [ -z "$ROOTFS_PATH" ]; then
            echo "❌ Файл rootfs не найден в релизах! Убедитесь, что Step 1 был успешно выполнен."
            exit 1
          fi
          echo "Найден rootfs: $ROOTFS_PATH"
          echo "file=$ROOTFS_PATH" >> $GITHUB_OUTPUT

      - name: 🧱 打包 iStoreOS 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.get_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: ophub

      - name: 📜 调整.img.gz 文件名
        id: rename
        run: |
          if [ -d "${{ env.PACKAGED_OUTPUTPATH }}" ]; then
            for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
              if [ -f "$FILE" ]; then
                echo "Processing file: $FILE"
                FILENAME=$(basename "$FILE")
                NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/iStoreOS_${{ env.VERSION }}-Docker-${{ env.DOCKER }}/g')
                if [ "$FILENAME" != "$NEW_FILENAME" ]; then
                  mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
                  echo "Renamed $FILENAME to $NEW_FILENAME"
                fi
              fi
            done
          fi

      - name: 📅 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ inputs.openwrt_board }}-${{ env.VERSION }}-${{ steps.date.outputs.date }}
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
